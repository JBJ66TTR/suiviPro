<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LeadFlow - Lead Manager</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px;
    }

    header {
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 32px;
      color: #2563eb;
      margin-bottom: 8px;
    }

    header p {
      color: #6b7280;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .stat h3 {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stat p {
      font-size: 28px;
      font-weight: bold;
    }

    /* ADD LEAD */

    .card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 14px;
    }

    .add-button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 7px;
      cursor: pointer;
      margin-top: 15px;
      font-weight: bold;
    }

    .add-button:hover {
      background: #1d4ed8;
    }

    /* SEARCH */

    .search {
      margin-bottom: 20px;
    }

    /* LEADS */

    .lead {
      border: 1px solid #e5e7eb;
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .lead-info h3 {
      margin-bottom: 6px;
    }

    .lead-info p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .lead-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status {
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #e5e7eb;
    }

    .delete {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .empty {
      color: #6b7280;
      text-align: center;
      padding: 30px;
    }

    /* MOBILE */

    @media (max-width: 750px) {

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .lead {
        flex-direction: column;
        align-items: flex-start;
      }

      .lead-actions {
        width: 100%;
        justify-content: space-between;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <header>

    <h1>LeadFlow</h1>

    <p>
      Manage your leads and never forget a follow-up.
    </p>

  </header>


  <!-- STATISTICS -->

  <div class="stats">

    <div class="stat">

      <h3>Total Leads</h3>

      <p id="totalLeads">
        0
      </p>

    </div>


    <div class="stat">

      <h3>New</h3>

      <p id="newLeads">
        0
      </p>

    </div>


    <div class="stat">

      <h3>Interested</h3>

      <p id="interestedLeads">
        0
      </p>

    </div>


    <div class="stat">

      <h3>Customers</h3>

      <p id="customers">
        0
      </p>

    </div>

  </div>


  <!-- ADD LEAD -->

  <div class="card">

    <h2>Add New Lead</h2>

    <div class="form-grid">

      <input
        id="name"
        placeholder="Name"
      >

      <input
        id="company"
        placeholder="Company"
      >

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input
        id="phone"
        placeholder="Phone"
      >

      <input
        id="followUp"
        type="date"
      >

      <select id="status">

        <option value="New">
          New
        </option>

        <option value="Contacted">
          Contacted
        </option>

        <option value="Interested">
          Interested
        </option>

        <option value="Customer">
          Customer
        </option>

        <option value="Lost">
          Lost
        </option>

      </select>

    </div>


    <button
      class="add-button"
      onclick="addLead()"
    >
      + Add Lead
    </button>

  </div>


  <!-- LEAD LIST -->

  <div class="card">

    <h2>Your Leads</h2>

    <div class="search">

      <input
        id="search"
        placeholder="Search leads..."
        oninput="displayLeads()"
      >

    </div>


    <div id="leadList"></div>

  </div>

</div>


<script>

  // =================================
  // LOAD LEADS
  // =================================

  let leads =
    JSON.parse(
      localStorage.getItem("leadflowLeads")
    ) || [];


  // =================================
  // ADD LEAD
  // =================================

  function addLead() {

    const name =
      document.getElementById("name").value.trim();

    const company =
      document.getElementById("company").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const followUp =
      document.getElementById("followUp").value;

    const status =
      document.getElementById("status").value;


    // Check name

    if (!name) {

      alert("Please enter the lead's name.");

      return;

    }


    const lead = {

      id: Date.now(),

      name: name,

      company: company,

      email: email,

      phone: phone,

      followUp: followUp,

      status: status

    };


    leads.push(lead);


    saveLeads();

    displayLeads();

    updateStats();


    // Clear form

    document.getElementById("name").value = "";

    document.getElementById("company").value = "";

    document.getElementById("email").value = "";

    document.getElementById("phone").value = "";

    document.getElementById("followUp").value = "";

    document.getElementById("status").value = "New";

  }


  // =================================
  // SAVE
  // =================================

  function saveLeads() {

    localStorage.setItem(
      "leadflowLeads",
      JSON.stringify(leads)
    );

  }


  // =================================
  // DELETE
  // =================================

  function deleteLead(id) {

    leads =
      leads.filter(
        lead => lead.id !== id
      );


    saveLeads();

    displayLeads();

    updateStats();

  }


  // =================================
  // DISPLAY LEADS
  // =================================

  function displayLeads() {

    const list =
      document.getElementById("leadList");

    const search =
      document
        .getElementById("search")
        .value
        .toLowerCase();


    const filtered =
      leads.filter(lead =>

        lead.name.toLowerCase().includes(search) ||

        lead.company.toLowerCase().includes(search) ||

        lead.email.toLowerCase().includes(search)

      );


    list.innerHTML = "";


    if (filtered.length === 0) {

      list.innerHTML = `
        <div class="empty">
          No leads found.
        </div>
      `;

      return;

    }


    filtered.forEach(lead => {

      const item =
        document.createElement("div");

      item.className = "lead";


      item.innerHTML = `

        <div class="lead-info">

          <h3>
            ${escapeHTML(lead.name)}
          </h3>

          <p>
            ${escapeHTML(lead.company || "No company")}
          </p>

          <p>
            ${escapeHTML(lead.email || "No email")}
          </p>

          <p>
            Follow-up:
            ${lead.followUp || "Not scheduled"}
          </p>

        </div>


        <div class="lead-actions">

          <span class="status">
            ${escapeHTML(lead.status)}
          </span>

          <button
            class="delete"
            onclick="deleteLead(${lead.id})"
          >
            Delete
          </button>

        </div>

      `;


      list.appendChild(item);

    });

  }


  // =================================
  // STATISTICS
  // =================================

  function updateStats() {

    document.getElementById("totalLeads")
      .textContent = leads.length;


    document.getElementById("newLeads")
      .textContent =
        leads.filter(
          lead => lead.status === "New"
        ).length;


    document.getElementById("interestedLeads")
      .textContent =
        leads.filter(
          lead => lead.status === "Interested"
        ).length;


    document.getElementById("customers")
      .textContent =
        leads.filter(
          lead => lead.status === "Customer"
        ).length;

  }


  // =================================
  // SECURITY
  // =================================

  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  // =================================
  // START APP
  // =================================

  displayLeads();

  updateStats();

</script>

</body>
</html>
