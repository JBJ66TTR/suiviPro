<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion - SuiviPro</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">

    <div class="auth-container">

        <div class="auth-logo">
            SuiviPro
        </div>

        <h1 id="authTitle">
            Bienvenue sur SuiviPro
        </h1>

        <p class="auth-subtitle" id="authSubtitle">
            Connectez-vous pour accéder à votre espace.
        </p>


        <form id="authForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="vous@exemple.com"
                required
            >


            <label for="password">
                Mot de passe
            </label>

            <input
                type="password"
                id="password"
                placeholder="Votre mot de passe"
                required
            >


            <button type="submit" id="authButton">
                Se connecter
            </button>

        </form>


        <p
            id="authMessage"
            class="auth-message"
        ></p>


        <div class="auth-switch">

            <span id="switchText">
                Vous n'avez pas encore de compte ?
            </span>

            <button
                type="button"
                id="switchButton"
            >
                Créer un compte
            </button>

        </div>

    </div>


    <script src="auth.js"></script>

</body>

</html>
